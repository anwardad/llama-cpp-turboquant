name: Build Windows CPU Binary (Ivy Bridge / No AVX2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feature/*

jobs:
  build:
    name: Windows MSVC Build (No AVX2)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_AVX=ON `
            -DGGML_AVX=ON `
            -DLLAMA_AVX2=OFF `
            -DGGML_AVX2=OFF `
            -DLLAMA_FMA=OFF `
            -DGGML_FMA=OFF `
            -DLLAMA_F16C=OFF `
            -DGGML_F16C=OFF `
            -DLLAMA_NATIVE=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DOPENSSL_USE_STATIC_LIBS=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" `
            -DLLAMA_STATIC=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DBUILD_TESTING=OFF

      - name: Build llama-server only
        run: |
          cmake --build build --config Release --parallel --target llama-server

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-turboquant-i5-3340
          path: |
            build/bin/Release/llama-server.exe
